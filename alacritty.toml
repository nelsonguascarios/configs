[window]
padding = { x = 10, y = 10 }
decorations = "full"
opacity = 1.0
blur = false
title = "Alacritty"
dynamic_title = true

[terminal]
osc52 = "CopyPaste"

[font]
size = 13.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 650
unfocused_hollow = true

[scrolling]
history = 10000
multiplier = 5

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#000000"
foreground = "#C0C0C0"

[colors.cursor]
text = "#0a0a0f"
cursor = "#00e5ff"

[colors.selection]
text = "#0a0a0f"
background = "#7c6af7"

[colors.hints.start]
foreground = "#0a0a0f"
background = "#f5c542"

[colors.hints.end]
foreground = "#0a0a0f"
background = "#f5a623"

[colors.normal]
black   = "#1a1a2e"
red     = "#ff5f6d"
green   = "#43e97b"
yellow  = "#f9ca24"
blue    = "#4d9de0"
magenta = "#c77dff"
cyan    = "#00e5ff"
white   = "#c8c8d8"

[colors.bright]
black   = "#f9ca24"
red     = "#ff8a80"
green   = "#69f0ae"
yellow  = "#ffd740"
blue    = "#82b1ff"
magenta = "#e040fb"
cyan    = "#64ffda"
white   = "#f5f5ff"

[colors.dim]
black   = "#0f0f1a"
red     = "#b03060"
green   = "#2e8b57" 
yellow  = "#b8860b"
blue    = "#2a6496"
magenta = "#7b2d8b"
cyan    = "#008b8b"
white   = "#808090"

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[[mouse.bindings]]
mouse = "Right"
action = "Paste"
